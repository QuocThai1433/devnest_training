server:
  port: 8888

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8080
          predicates:
            - Path=/api/v1/auth/**

        - id: course-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/course

